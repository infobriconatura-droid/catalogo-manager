<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Catalogo - Catalogo Manager v4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1b4332, #2d6a4f);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .header .back-link {
            color: #fff;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .header .back-link:hover {
            opacity: 1;
        }

        .controls {
            background: #16213e;
            padding: 20px 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid #2a3f5f;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group label {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        select, input {
            background: #1a1a2e;
            border: 1px solid #2a3f5f;
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #2d6a4f;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2d6a4f, #40916c);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(45, 106, 79, 0.4);
        }

        .btn-secondary {
            background: #2a3f5f;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #3a4f6f;
        }

        .btn-pdf {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            color: #fff;
        }

        .btn-pdf:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }

        .page-nav {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .page-info {
            font-size: 1.1rem;
            color: #94a3b8;
        }

        .page-info strong {
            color: #fff;
        }

        .preview-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            overflow: hidden;
            max-width: 100%;
        }

        .preview-container img {
            display: block;
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px;
            color: #94a3b8;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #2a3f5f;
            border-top-color: #2d6a4f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .stats {
            display: flex;
            gap: 30px;
            margin-left: auto;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2d6a4f;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #2d6a4f;
            color: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
        }

        .empty-state h2 {
            margin-bottom: 10px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Preview Catalogo</h1>
        <a href="/" class="back-link">Torna al Manager</a>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Categoria:</label>
            <select id="categoriaSelect">
                <option value="">Caricamento...</option>
            </select>
        </div>

        <div class="control-group">
            <label>Prodotti/pagina:</label>
            <select id="itemsPerPage">
                <option value="2">2 (1 riga)</option>
                <option value="4" selected>4 (2 righe)</option>
                <option value="6">6 (3 righe)</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="loadPage(1)">
            Carica Preview
        </button>

        <button class="btn btn-pdf" onclick="generatePDF()" id="pdfBtn">
            Genera PDF
        </button>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="totalProducts">-</div>
                <div class="stat-label">Prodotti</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="totalPages">-</div>
                <div class="stat-label">Pagine</div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="page-nav">
            <button class="btn btn-secondary" onclick="prevPage()" id="prevBtn" disabled>
                &larr; Precedente
            </button>
            <div class="page-info">
                Pagina <strong id="currentPage">-</strong> di <strong id="maxPages">-</strong>
            </div>
            <button class="btn btn-secondary" onclick="nextPage()" id="nextBtn" disabled>
                Successiva &rarr;
            </button>
        </div>

        <div class="preview-container" id="previewContainer">
            <div class="empty-state">
                <h2>Seleziona una categoria</h2>
                <p>Scegli la categoria e clicca "Carica Preview" per visualizzare l'anteprima del catalogo</p>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currentPageNum = 1;
        let totalPagesNum = 0;

        // Carica categorie all'avvio
        async function loadCategories() {
            try {
                const res = await fetch('/api/catalog/categories');
                const data = await res.json();

                const select = document.getElementById('categoriaSelect');
                select.innerHTML = data.categories.map(cat =>
                    `<option value="${cat.categoria}">${cat.categoria} (${cat.count} prodotti)</option>`
                ).join('');

                if (data.categories.length === 0) {
                    select.innerHTML = '<option value="">Nessuna categoria</option>';
                }
            } catch (err) {
                showToast('Errore nel caricamento categorie', true);
            }
        }

        async function loadPage(pageNum) {
            const categoria = document.getElementById('categoriaSelect').value;
            const itemsPerPage = document.getElementById('itemsPerPage').value;

            if (!categoria) {
                showToast('Seleziona una categoria', true);
                return;
            }

            const container = document.getElementById('previewContainer');
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Generazione pagina ${pageNum}...</p>
                </div>
            `;

            try {
                const res = await fetch(`/api/catalog/page-dynamic/${pageNum}?categoria=${encodeURIComponent(categoria)}`);
                const data = await res.json();

                if (data.error) {
                    container.innerHTML = `<div class="empty-state"><h2>Errore</h2><p>${data.error}</p></div>`;
                    return;
                }

                currentPageNum = data.page_number;
                totalPagesNum = data.total_pages;

                document.getElementById('currentPage').textContent = currentPageNum;
                document.getElementById('maxPages').textContent = totalPagesNum;
                document.getElementById('totalPages').textContent = totalPagesNum;

                // Aggiorna pulsanti navigazione
                document.getElementById('prevBtn').disabled = currentPageNum <= 1;
                document.getElementById('nextBtn').disabled = currentPageNum >= totalPagesNum;

                container.innerHTML = `<img src="${data.image}" alt="Pagina ${currentPageNum}">`;

            } catch (err) {
                container.innerHTML = `<div class="empty-state"><h2>Errore</h2><p>${err.message}</p></div>`;
            }
        }

        async function loadPagesInfo() {
            const categoria = document.getElementById('categoriaSelect').value;
            const itemsPerPage = document.getElementById('itemsPerPage').value;

            if (!categoria) return;

            try {
                const res = await fetch(`/api/catalog/pages-dynamic?categoria=${encodeURIComponent(categoria)}`);
                const data = await res.json();

                document.getElementById('totalProducts').textContent = data.total_products;
                document.getElementById('totalPages').textContent = data.total_pages;
                totalPagesNum = data.total_pages;
            } catch (err) {
                console.error(err);
            }
        }

        function prevPage() {
            if (currentPageNum > 1) {
                loadPage(currentPageNum - 1);
            }
        }

        function nextPage() {
            if (currentPageNum < totalPagesNum) {
                loadPage(currentPageNum + 1);
            }
        }

        async function generatePDF() {
            const categoria = document.getElementById('categoriaSelect').value;
            const itemsPerPage = document.getElementById('itemsPerPage').value;

            if (!categoria) {
                showToast('Seleziona una categoria', true);
                return;
            }

            const btn = document.getElementById('pdfBtn');
            btn.disabled = true;
            btn.textContent = 'Generazione...';

            showToast('Generazione PDF in corso...');

            try {
                const res = await fetch('/api/catalog/pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        categoria: categoria,
                        items_per_page: parseInt(itemsPerPage),
                        template: 'corporate'
                    })
                });

                const data = await res.json();

                if (data.error) {
                    showToast(data.error, true);
                    return;
                }

                showToast(`PDF generato! ${data.pages} pagine, ${data.products} prodotti`);

                // Scarica automaticamente
                window.location.href = data.download_url;

            } catch (err) {
                showToast('Errore nella generazione PDF', true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Genera PDF';
            }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');

            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        // Event listeners
        document.getElementById('categoriaSelect').addEventListener('change', loadPagesInfo);
        document.getElementById('itemsPerPage').addEventListener('change', loadPagesInfo);

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevPage();
            if (e.key === 'ArrowRight') nextPage();
        });

        // Init
        loadCategories();
    </script>
</body>
</html>
