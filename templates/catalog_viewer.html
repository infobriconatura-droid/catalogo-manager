<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo Viewer - Catalogo Manager v4.1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-dark: #0f0f0f;
            --bg-panel: #1a1a1a;
            --bg-card: #252525;
            --accent: #2d6a4f;
            --accent-light: #40916c;
            --text: #ffffff;
            --text-muted: #888;
            --border: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #1b4332, #2d6a4f);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header select, .header input {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .header select:focus { outline: none; border-color: var(--accent-light); }

        .header select option {
            background: #1a1a2e;
            color: white;
            padding: 8px;
        }

        /* MAIN LAYOUT */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* SIDEBAR - Miniature pagine */
        .sidebar {
            width: 180px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .page-thumb {
            background: var(--bg-card);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            min-height: 50px;
            overflow: hidden;
            border: 2px solid var(--border);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-thumb:hover {
            border-color: var(--accent);
            transform: scale(1.02);
        }

        .page-thumb.active {
            border-color: var(--accent-light);
            box-shadow: 0 0 10px rgba(45, 106, 79, 0.5);
        }

        .page-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .page-thumb .page-num {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.7rem;
        }

        /* VIEWER AREA */
        .viewer-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* TOOLBAR */
        .toolbar {
            background: var(--bg-panel);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .toolbar-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn:hover { background: var(--accent); border-color: var(--accent); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn.active { background: var(--accent); border-color: var(--accent); }

        .zoom-display {
            background: var(--bg-card);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            min-width: 70px;
            text-align: center;
        }

        .page-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-nav input {
            width: 60px;
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: white;
            padding: 8px;
            border-radius: 6px;
        }

        /* CANVAS VIEWER */
        .canvas-container {
            flex: 1;
            overflow: auto;
            background: #2a2a2a;
            display: flex;
            justify-content: center;
            padding: 20px;
            cursor: grab;
        }

        .canvas-container:active { cursor: grabbing; }

        .page-wrapper {
            background: white;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            position: relative;
            transition: transform 0.1s ease-out;
        }

        /* GRIGLIA PRODOTTI (cliccabili) */
        .products-grid {
            display: grid;
            gap: 15px;
            padding: 20px;
        }

        .products-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .products-grid.cols-1 { grid-template-columns: 1fr; }

        .product-box {
            background: white;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .product-box:hover {
            border-color: var(--accent);
            box-shadow: 0 5px 20px rgba(45, 106, 79, 0.3);
            transform: translateY(-2px);
        }

        .product-box img {
            width: 100%;
            display: block;
        }

        .product-box .edit-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(45, 106, 79, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .product-box:hover .edit-overlay { opacity: 1; }

        .edit-overlay span {
            color: white;
            font-weight: 600;
            font-size: 1rem;
        }

        /* LOADING */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.error { background: #dc2626; }

        /* INFO PANEL */
        .info-panel {
            background: var(--bg-panel);
            padding: 10px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .info-panel strong { color: var(--text); }

        /* KEYBOARD HINTS */
        .kbd {
            background: var(--bg-card);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.75rem;
            margin: 0 2px;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <h1>
            <span>📖</span>
            Catalogo Viewer
        </h1>
        <div class="header-controls">
            <select id="categoriaSelect">
                <option value="">Seleziona categoria...</option>
            </select>
            <a href="/" class="btn">← Torna al Manager</a>
        </div>
    </div>

    <!-- MAIN LAYOUT -->
    <div class="main-layout">
        <!-- SIDEBAR - Miniature -->
        <div class="sidebar" id="sidebar">
            <div style="text-align:center; color: var(--text-muted); padding: 20px;">
                Seleziona una categoria
            </div>
        </div>

        <!-- VIEWER AREA -->
        <div class="viewer-area">
            <!-- TOOLBAR -->
            <div class="toolbar">
                <div class="toolbar-group">
                    <button class="btn" onclick="zoomOut()" title="Zoom Out (-)">➖</button>
                    <div class="zoom-display" id="zoomDisplay">100%</div>
                    <button class="btn" onclick="zoomIn()" title="Zoom In (+)">➕</button>
                    <button class="btn" onclick="zoomFit()" title="Adatta (F)">📐 Fit</button>
                    <button class="btn" onclick="zoom100()" title="100% (1)">1:1</button>
                </div>

                <div class="toolbar-group page-nav">
                    <button class="btn" onclick="prevPage()" id="prevBtn" disabled>◀ Prec</button>
                    <input type="number" id="pageInput" value="1" min="1" onchange="goToPage(this.value)">
                    <span>/ <span id="totalPagesSpan">-</span></span>
                    <button class="btn" onclick="nextPage()" id="nextBtn" disabled>Succ ▶</button>
                </div>

                <div class="toolbar-group">
                    <button class="btn" onclick="generatePDF()" id="pdfBtn">📄 Genera PDF</button>
                </div>
            </div>

            <!-- CANVAS -->
            <div class="canvas-container" id="canvasContainer">
                <div class="page-wrapper" id="pageWrapper">
                    <div style="padding: 100px; text-align: center; color: #999;">
                        <h2>Seleziona una categoria</h2>
                        <p>per visualizzare il catalogo</p>
                    </div>
                </div>
            </div>

            <!-- INFO PANEL -->
            <div class="info-panel">
                <div>
                    <span id="infoProducts">-</span> prodotti |
                    <span id="infoPages">-</span> pagine |
                    Layout: <strong>Dinamico (2 col)</strong>
                </div>
                <div>
                    <span class="kbd">←</span><span class="kbd">→</span> Naviga |
                    <span class="kbd">+</span><span class="kbd">-</span> Zoom |
                    <span class="kbd">F</span> Fit |
                    <span class="kbd">Click</span> su prodotto per modificare
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // STATE
        let currentPage = 1;
        let totalPages = 0;
        let currentZoom = 1;
        let categoria = '';
        let pagesData = [];
        let productPositions = []; // Per click detection

        const DYNAMIC_LAYOUT = true;  // Usa impaginazione dinamica
        const ZOOM_STEP = 0.1;
        const MIN_ZOOM = 0.3;
        const MAX_ZOOM = 3;

        // INIT
        async function init() {
            await loadCategories();
            setupKeyboardShortcuts();
            setupMouseWheel();

            // Controlla se c'è una categoria nell'URL
            const urlParams = new URLSearchParams(window.location.search);
            const urlCategoria = urlParams.get('categoria');
            if (urlCategoria && urlCategoria !== 'default') {
                const select = document.getElementById('categoriaSelect');
                select.value = urlCategoria;
                if (select.value === urlCategoria) {
                    categoria = urlCategoria;
                    loadCatalog();
                }
            }
        }

        async function loadCategories() {
            try {
                const res = await fetch('/api/catalog/categories');
                const data = await res.json();

                const select = document.getElementById('categoriaSelect');
                select.innerHTML = '<option value="">Seleziona categoria...</option>' +
                    data.categories
                        .filter(c => c.categoria && c.categoria !== 'null')
                        .map(c => `<option value="${c.categoria}">${c.categoria} (${c.count})</option>`)
                        .join('');

                select.addEventListener('change', (e) => {
                    if (e.target.value) {
                        categoria = e.target.value;
                        loadCatalog();
                    }
                });
            } catch (err) {
                showToast('Errore caricamento categorie', true);
            }
        }

        async function loadCatalog() {
            showLoading(true);

            try {
                // Carica info pagine con layout DINAMICO
                const res = await fetch(`/api/catalog/pages-dynamic?categoria=${encodeURIComponent(categoria)}`);
                pagesData = await res.json();

                totalPages = pagesData.total_pages;
                currentPage = 1;

                document.getElementById('totalPagesSpan').textContent = totalPages;
                document.getElementById('pageInput').max = totalPages;
                document.getElementById('infoProducts').textContent = pagesData.total_products;
                document.getElementById('infoPages').textContent = totalPages;

                // Carica miniature sidebar
                loadThumbnails();

                // Carica prima pagina
                await loadPageContent(1);

                updateNavButtons();

            } catch (err) {
                showToast('Errore caricamento catalogo', true);
            } finally {
                showLoading(false);
            }
        }

        function loadThumbnails() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';

            // Mostra TUTTE le pagine come numeri (molto più veloce)
            for (let i = 1; i <= totalPages; i++) {
                const thumb = document.createElement('div');
                thumb.className = 'page-thumb' + (i === 1 ? ' active' : '');
                thumb.setAttribute('data-page', i);

                // Prendi info prodotti per questa pagina
                const pageInfo = pagesData.pages && pagesData.pages[i-1];
                const numProducts = pageInfo ? pageInfo.num_products : '?';

                thumb.innerHTML = `
                    <span style="font-size:1rem; font-weight:bold; color:var(--accent-light);">Pag ${i}</span>
                `;
                thumb.onclick = () => goToPage(i);
                sidebar.appendChild(thumb);
            }
        }

        async function loadThumbnailImage(pageNum, thumbElement) {
            try {
                const res = await fetch(`/api/catalog/page-dynamic/${pageNum}?categoria=${encodeURIComponent(categoria)}`);
                const data = await res.json();

                if (data.image) {
                    thumbElement.innerHTML = `
                        <img src="${data.image}" alt="Pagina ${pageNum}">
                        <span class="page-num">${pageNum}</span>
                    `;
                }
            } catch (err) {
                // Silently fail for thumbnails
            }
        }

        async function loadPageContent(pageNum) {
            showLoading(true);

            try {
                // Prendi i prodotti della pagina
                const pageInfo = pagesData.pages[pageNum - 1];
                if (!pageInfo) return;

                const products = pageInfo.products;
                productPositions = products;

                // Trova posizione iniziale pagina (prima posizione dei prodotti)
                const firstPos = products.length > 0 ? (products[0].posizione || '-') : '-';
                const lastPos = products.length > 0 ? (products[products.length-1].posizione || '-') : '-';

                // Costruisci pagina completa con header e footer
                const wrapper = document.getElementById('pageWrapper');
                wrapper.innerHTML = '';

                // Container pagina A4
                const pageContainer = document.createElement('div');
                pageContainer.className = 'catalog-page';
                pageContainer.style.cssText = `
                    width: 800px;
                    min-height: 1130px;
                    background: white;
                    display: flex;
                    flex-direction: column;
                    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
                    border-radius: 4px;
                    overflow: hidden;
                `;

                // HEADER - Striscia categoria
                const header = document.createElement('div');
                header.className = 'page-header';
                header.style.cssText = `
                    background: linear-gradient(135deg, #1b4332, #2d6a4f);
                    color: white;
                    padding: 12px 20px;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    font-family: Arial, sans-serif;
                `;
                header.innerHTML = `
                    <div style="font-weight: bold; font-size: 1.1rem;">${categoria.replace(/_/g, ' ')}</div>
                    <div style="font-size: 0.9rem;">Pos. ${firstPos} - ${lastPos}</div>
                `;
                pageContainer.appendChild(header);

                // GRID prodotti
                const grid = document.createElement('div');
                grid.className = 'products-grid cols-2';
                grid.style.cssText = `
                    flex: 1;
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 10px;
                    padding: 15px;
                    background: white;
                `;

                // Carica ogni box prodotto
                for (const prod of products) {
                    const box = document.createElement('div');
                    box.className = 'product-box';
                    box.dataset.id = prod.id;
                    box.dataset.codice = prod.codice_principale;

                    // Carica immagine box
                    try {
                        const boxRes = await fetch(`/api/box/${prod.id}?template=corporate`);
                        const boxData = await boxRes.json();

                        box.innerHTML = `
                            <img src="${boxData.image}" alt="${prod.titolo}">
                            <div class="edit-overlay">
                                <span>✏️ Modifica ${prod.codice_principale}</span>
                            </div>
                        `;
                    } catch (err) {
                        box.innerHTML = `
                            <div style="padding:40px; text-align:center; background:#f5f5f5;">
                                <strong>${prod.codice_principale}</strong><br>
                                ${prod.titolo}
                            </div>
                            <div class="edit-overlay">
                                <span>✏️ Modifica</span>
                            </div>
                        `;
                    }

                    // Click per modificare
                    box.onclick = () => openProductEditor(prod.id, prod.codice_principale);

                    grid.appendChild(box);
                }

                pageContainer.appendChild(grid);

                // FOOTER - Numero pagina
                const footer = document.createElement('div');
                footer.className = 'page-footer';
                footer.style.cssText = `
                    background: #f0f0f0;
                    color: #333;
                    padding: 10px 20px;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    font-family: Arial, sans-serif;
                    font-size: 0.85rem;
                    border-top: 2px solid #2d6a4f;
                `;
                footer.innerHTML = `
                    <div>PUGLIESE GROUP - Catalogo ${new Date().getFullYear()}</div>
                    <div style="font-weight: bold;">Pagina ${pageNum} di ${totalPages}</div>
                `;
                pageContainer.appendChild(footer);

                wrapper.appendChild(pageContainer);
                wrapper.style.transform = `scale(${currentZoom})`;
                wrapper.style.transformOrigin = 'top center';

                // Update sidebar active
                document.querySelectorAll('.page-thumb').forEach((t, i) => {
                    t.classList.toggle('active', i + 1 === pageNum);
                });

                currentPage = pageNum;
                document.getElementById('pageInput').value = pageNum;
                updateNavButtons();

            } catch (err) {
                showToast('Errore caricamento pagina', true);
            } finally {
                showLoading(false);
            }
        }

        function openProductEditor(prodId, codice) {
            // Apri in nuova tab per non perdere il posto nel catalogo
            window.open(`/?edit=${prodId}`, '_blank');
            showToast(`Apertura prodotto ${codice}...`);
        }

        // NAVIGATION
        function prevPage() {
            if (currentPage > 1) {
                goToPage(currentPage - 1);
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                goToPage(currentPage + 1);
            }
        }

        function goToPage(pageNum) {
            pageNum = parseInt(pageNum);
            if (pageNum >= 1 && pageNum <= totalPages) {
                loadPageContent(pageNum);
            }
        }

        function updateNavButtons() {
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }

        // ZOOM
        function zoomIn() {
            setZoom(currentZoom + ZOOM_STEP);
        }

        function zoomOut() {
            setZoom(currentZoom - ZOOM_STEP);
        }

        function zoomFit() {
            const container = document.getElementById('canvasContainer');
            const wrapper = document.getElementById('pageWrapper');
            const grid = wrapper.querySelector('.products-grid');

            if (grid) {
                const containerWidth = container.clientWidth - 40;
                const gridWidth = 800;
                setZoom(Math.min(containerWidth / gridWidth, 1.5));
            }
        }

        function zoom100() {
            setZoom(1);
        }

        function setZoom(zoom) {
            currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom));

            const wrapper = document.getElementById('pageWrapper');
            wrapper.style.transform = `scale(${currentZoom})`;

            document.getElementById('zoomDisplay').textContent = Math.round(currentZoom * 100) + '%';
        }

        // KEYBOARD SHORTCUTS
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;

                switch(e.key) {
                    case 'ArrowLeft': prevPage(); break;
                    case 'ArrowRight': nextPage(); break;
                    case '+': case '=': zoomIn(); break;
                    case '-': zoomOut(); break;
                    case 'f': case 'F': zoomFit(); break;
                    case '1': zoom100(); break;
                }
            });
        }

        // MOUSE WHEEL ZOOM
        function setupMouseWheel() {
            document.getElementById('canvasContainer').addEventListener('wheel', (e) => {
                if (e.ctrlKey) {
                    e.preventDefault();
                    if (e.deltaY < 0) zoomIn();
                    else zoomOut();
                }
            }, { passive: false });
        }

        // PDF GENERATION
        async function generatePDF() {
            if (!categoria) {
                showToast('Seleziona una categoria', true);
                return;
            }

            const btn = document.getElementById('pdfBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Generazione...';

            try {
                const res = await fetch('/api/catalog/pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        categoria: categoria,
                        items_per_page: ITEMS_PER_PAGE,
                        template: 'corporate'
                    })
                });

                const data = await res.json();

                if (data.error) {
                    showToast(data.error, true);
                    return;
                }

                showToast(`PDF generato! ${data.pages} pagine`);
                window.location.href = data.download_url;

            } catch (err) {
                showToast('Errore generazione PDF', true);
            } finally {
                btn.disabled = false;
                btn.textContent = '📄 Genera PDF';
            }
        }

        // UTILS
        function showLoading(show) {
            const container = document.getElementById('canvasContainer');
            const existing = container.querySelector('.loading-overlay');

            if (show && !existing) {
                const overlay = document.createElement('div');
                overlay.className = 'loading-overlay';
                overlay.innerHTML = '<div class="spinner"></div>';
                container.appendChild(overlay);
            } else if (!show && existing) {
                existing.remove();
            }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => toast.className = 'toast', 3000);
        }

        // START
        init();
    </script>
</body>
</html>
